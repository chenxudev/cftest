<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cftest · 数据管理</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; color: #20282b; background: #f4f6f5; font-synthesis: none; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .42; }
    .topbar { height: 64px; background: #fff; border-bottom: 1px solid #e2e7e5; }
    .top-inner { max-width: 1200px; height: 100%; margin: 0 auto; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 11px; color: #182622; font-size: 17px; font-weight: 750; }
    .brand-mark { width: 30px; height: 30px; display: grid; place-items: center; background: #e76f36; color: #fff; border-radius: 6px; font-size: 11px; font-weight: 800; }
    .brand-sub { color: #9aa5a0; font-size: 13px; font-weight: 400; border-left: 1px solid #e5e9e7; padding-left: 12px; }
    .status { display: flex; align-items: center; gap: 7px; color: #697972; font-size: 12px; white-space: nowrap; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #b7c0bc; }
    .status.online .dot { background: #299c6b; box-shadow: 0 0 0 3px #e4f5ec; }
    .status.offline .dot { background: #d25b4a; }
    .status.offline { color: #b4483b; }
    main { max-width: 1200px; margin: 0 auto; padding: 54px 28px 80px; }
    .eyebrow { color: #668076; font-size: 12px; font-weight: 700; margin: 0 0 10px; }
    .heading { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 30px; }
    h1 { margin: 0; font-size: 28px; line-height: 1.3; font-weight: 750; }
    .subtitle { margin: 8px 0 0; color: #75817c; font-size: 14px; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .refresh { background: #fff; color: #34453e; border: 1px solid #d9e2de; border-radius: 5px; padding: 9px 13px; white-space: nowrap; font-size: 13px; font-weight: 600; }
    .refresh:hover, .secondary:hover:not(:disabled) { border-color: #9fb4a9; background: #f8fbf9; }
    .refresh-icon { font-size: 17px; vertical-align: -1px; margin-right: 5px; }
    .workspace { background: #fff; border: 1px solid #e0e7e3; border-radius: 6px; overflow: hidden; }
    .section-top { padding: 22px 24px 18px; display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid #edf1ef; }
    .section-title { display: flex; align-items: center; gap: 10px; }
    h2 { margin: 0; font-size: 16px; font-weight: 700; }
    .tag { border-radius: 3px; padding: 4px 7px; color: #527467; background: #edf5f0; font-size: 11px; font-weight: 650; }
    .controls { display: flex; align-items: center; gap: 8px; }
    .input { width: 160px; height: 36px; padding: 0 11px; border: 1px solid #dbe3df; border-radius: 5px; color: #20312a; outline: none; }
    .input:focus, select:focus { border-color: #38996c; box-shadow: 0 0 0 3px #e2f4e9; }
    .input::placeholder { color: #a2aea8; }
    .primary, .secondary { min-height: 36px; padding: 0 13px; border-radius: 5px; font-size: 13px; font-weight: 600; white-space: nowrap; }
    .primary { border: 1px solid #287b57; background: #287b57; color: #fff; }
    .primary:hover { background: #1e6949; }
    .secondary { border: 1px solid #dbe3df; background: #fff; color: #44564e; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; text-align: left; }
    th { padding: 13px 24px; background: #fafcfb; color: #88968f; font-size: 11px; font-weight: 650; border-bottom: 1px solid #edf1ef; }
    td { padding: 17px 24px; color: #56665e; font-size: 13px; line-height: 1.5; border-bottom: 1px solid #f0f3f1; overflow-wrap: anywhere; vertical-align: top; }
    tr:last-child td { border-bottom: 0; }
    td:first-child { color: #99a69f; font-variant-numeric: tabular-nums; }
    td:nth-child(2) { color: #253b30; font-weight: 650; }
    .empty { min-height: 180px; padding: 48px 20px; text-align: center; color: #87958d; font-size: 13px; }
    .empty.error { color: #b4483b; }
    .footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 70px; padding: 14px 24px; border-top: 1px solid #edf1ef; color: #829087; font-size: 12px; }
    .paging { display: flex; align-items: center; gap: 8px; }
    select { height: 34px; padding: 0 27px 0 9px; border: 1px solid #dbe3df; border-radius: 5px; background: #fff; color: #506259; outline: none; }
    .paging .secondary { min-height: 34px; }
    .meta { margin-top: 18px; display: flex; justify-content: space-between; gap: 16px; color: #a0aca6; font-size: 12px; }
    .row-actions { display: flex; gap: 7px; }
    .row-actions button { border: 0; background: none; color: #287b57; padding: 2px 0; font-size: 13px; white-space: nowrap; }
    .row-actions .delete { color: #b4483b; }
    .row-actions button:hover { text-decoration: underline; }
    dialog { width: min(480px, calc(100% - 32px)); max-height: calc(100% - 32px); border: 1px solid #dbe3df; border-radius: 6px; padding: 0; color: #20282b; box-shadow: 0 18px 60px #24392c33; }
    dialog::backdrop { background: #16251e80; }
    .dialog-content { padding: 24px; }
    .dialog-content h2 { font-size: 18px; margin-bottom: 20px; }
    .field { display: block; margin: 0 0 16px; color: #34453e; font-size: 13px; font-weight: 600; }
    .field input, .field textarea { display: block; width: 100%; margin-top: 8px; border: 1px solid #dbe3df; border-radius: 5px; padding: 10px 11px; color: #20312a; font: inherit; font-weight: 400; }
    .field textarea { min-height: 100px; resize: vertical; }
    .field input:focus, .field textarea:focus { outline: 2px solid #b9e4cb; border-color: #38996c; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
    .dialog-error { color: #b4483b; font-size: 13px; line-height: 1.5; margin: 12px 0 0; }
    .danger { background: #b4483b; border-color: #b4483b; }
    .danger:hover { background: #953a30; }
    .confirm-copy { color: #56665e; font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; }
    @media (max-width: 700px) {
      .top-inner { padding: 0 18px; }
      .brand-sub { display: none; }
      main { padding: 36px 16px 60px; }
      h1 { font-size: 24px; }
      .heading { align-items: center; }
      .heading { flex-wrap: wrap; }
      .section-top { align-items: flex-start; flex-direction: column; padding: 20px 16px; }
      .controls { width: 100%; }
      .input { flex: 1; width: 0; min-width: 80px; }
      table { min-width: 660px; }
      th, td { padding-left: 16px; padding-right: 16px; }
      .footer { padding: 14px 16px; flex-wrap: wrap; }
      .meta { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="top-inner">
      <div class="brand"><span class="brand-mark">CF</span><span>cftest</span><span class="brand-sub">数据管理</span></div>
      <div class="status" id="status" aria-live="polite"><span class="dot"></span><span id="statusText">检查服务中</span></div>
    </div>
  </header>
  <main>
    <div class="heading">
      <div><p class="eyebrow">工作台 / 数据</p><h1>数据管理</h1><p class="subtitle">查看和查询数据库中的记录</p></div>
      <div class="header-actions"><button class="refresh" id="refresh" title="刷新数据"><span class="refresh-icon" aria-hidden="true">↻</span>刷新</button><button class="primary" id="create" type="button">新增记录</button></div>
    </div>
    <section class="workspace" aria-labelledby="recordsHeading">
      <div class="section-top">
        <div class="section-title"><h2 id="recordsHeading">记录列表</h2><span class="tag">D1</span></div>
        <form class="controls" id="searchForm">
          <input class="input" id="itemId" type="number" min="1" step="1" inputmode="numeric" placeholder="输入记录 ID" aria-label="记录 ID">
          <button class="primary" type="submit">查询</button>
          <button class="secondary" type="button" id="reset" hidden>全部记录</button>
        </form>
      </div>
      <div class="table-wrap" id="tableWrap" hidden>
        <table><colgroup><col style="width: 9%"><col style="width: 20%"><col style="width: 31%"><col style="width: 23%"><col style="width: 17%"></colgroup>
          <thead><tr><th scope="col">ID</th><th scope="col">名称</th><th scope="col">描述</th><th scope="col">创建时间</th><th scope="col">操作</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="empty" id="message" role="status">正在加载数据...</div>
      <div class="footer">
        <span id="summary">正在加载</span>
        <div class="paging">
          <label for="pageSize">每页</label>
          <select id="pageSize" aria-label="每页记录数"><option value="10">10 条</option><option value="20" selected>20 条</option><option value="50">50 条</option></select>
          <button class="secondary" id="prev" type="button">上一页</button>
          <button class="secondary" id="next" type="button">下一页</button>
        </div>
      </div>
    </section>
    <div class="meta"><span>cftest</span><span>Cloudflare Workers · D1</span></div>
  </main>
  <dialog id="editDialog" aria-labelledby="editTitle">
    <form id="editForm" class="dialog-content">
      <h2 id="editTitle">新增记录</h2>
      <label class="field">名称<input id="name" name="name" maxlength="200" required autocomplete="off"></label>
      <label class="field">描述<textarea id="description" name="description" maxlength="2000"></textarea></label>
      <p class="dialog-error" id="editError" role="alert" hidden></p>
      <div class="dialog-actions"><button type="button" class="secondary" id="cancelEdit">取消</button><button type="submit" class="primary" id="save">保存</button></div>
    </form>
  </dialog>
  <dialog id="deleteDialog" aria-labelledby="deleteTitle">
    <div class="dialog-content">
      <h2 id="deleteTitle">删除记录</h2>
      <p class="confirm-copy" id="deleteCopy"></p>
      <p class="dialog-error" id="deleteError" role="alert" hidden></p>
      <div class="dialog-actions"><button type="button" class="secondary" id="cancelDelete">取消</button><button type="button" class="primary danger" id="confirmDelete">删除</button></div>
    </div>
  </dialog>
  <script>
    const $ = (id) => document.getElementById(id);
    const state = { offset: 0, limit: 20, id: null, rows: [], sequence: 0, loading: false };

    async function getJson(url, options = {}) {
      const response = await fetch(url, { ...options, headers: { Accept: 'application/json', ...options.headers } });
      let body = null;
      if (response.status !== 204) {
        try { body = await response.json(); }
        catch { throw new Error('服务器返回的数据无效'); }
      }
      if (!response.ok) {
        const error = new Error(body?.error || '请求失败');
        error.status = response.status;
        throw error;
      }
      return body;
    }

    async function checkHealth() {
      try {
        await getJson('/api/health');
        $('status').className = 'status online';
        $('statusText').textContent = '服务运行中';
      } catch {
        $('status').className = 'status offline';
        $('statusText').textContent = '服务不可用';
      }
    }

    function setMessage(text, isError = false) {
      $('message').textContent = text;
      $('message').className = isError ? 'empty error' : 'empty';
      $('message').hidden = false;
      $('tableWrap').hidden = true;
    }

    function updateControls() {
      $('prev').disabled = state.loading || state.id !== null || state.offset === 0;
      $('next').disabled = state.loading || state.id !== null || state.rows.length < state.limit;
      $('pageSize').disabled = state.loading || state.id !== null;
      $('reset').hidden = state.id === null;
    }

    function renderRows(items) {
      const fragment = document.createDocumentFragment();
      for (const item of items) {
        const tr = document.createElement('tr');
        for (const key of ['id', 'name', 'description', 'created_at']) {
          const td = document.createElement('td');
          td.textContent = item[key] == null || item[key] === '' ? '—' : String(item[key]);
          tr.appendChild(td);
        }
        const actions = document.createElement('td');
        const group = document.createElement('div');
        group.className = 'row-actions';
        const edit = document.createElement('button');
        edit.type = 'button';
        edit.textContent = '编辑';
        edit.setAttribute('aria-label', `编辑记录 ${item.id}`);
        edit.addEventListener('click', () => openEditor(item));
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'delete';
        remove.textContent = '删除';
        remove.setAttribute('aria-label', `删除记录 ${item.id}`);
        remove.addEventListener('click', () => openDelete(item));
        group.append(edit, remove);
        actions.appendChild(group);
        tr.appendChild(actions);
        fragment.appendChild(tr);
      }
      $('rows').replaceChildren(fragment);
      $('tableWrap').hidden = false;
      $('message').hidden = true;
    }

    let editingId = null;
    let deletingItem = null;

    function openEditor(item = null) {
      editingId = item ? item.id : null;
      $('editTitle').textContent = item ? '编辑记录' : '新增记录';
      $('name').value = item?.name ?? '';
      $('name').setCustomValidity('');
      $('description').value = item?.description ?? '';
      $('editError').hidden = true;
      $('editDialog').showModal();
      $('name').focus();
    }

    function openDelete(item) {
      deletingItem = item;
      $('deleteCopy').textContent = `确定删除记录“${item.name}”（ID ${item.id}）吗？此操作无法撤销。`;
      $('deleteError').hidden = true;
      $('deleteDialog').showModal();
    }

    $('create').addEventListener('click', () => openEditor());
    $('cancelEdit').addEventListener('click', () => $('editDialog').close());
    $('cancelDelete').addEventListener('click', () => $('deleteDialog').close());
    $('editDialog').addEventListener('cancel', (event) => { if ($('save').disabled) event.preventDefault(); });
    $('deleteDialog').addEventListener('cancel', (event) => { if ($('confirmDelete').disabled) event.preventDefault(); });
    $('editForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const name = $('name').value.trim();
      if (!name) { $('name').setCustomValidity('请输入名称'); $('name').reportValidity(); return; }
      $('editError').hidden = true;
      $('save').disabled = true;
      $('cancelEdit').disabled = true;
      try {
        const isNew = editingId === null;
        await getJson(isNew ? '/api/items' : `/api/items/${encodeURIComponent(editingId)}`, {
          method: isNew ? 'POST' : 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, description: $('description').value })
        });
        $('editDialog').close();
        if (isNew) { state.id = null; state.offset = 0; $('itemId').value = ''; }
        await load();
      } catch (error) {
        $('editError').textContent = error.message || '保存失败，请稍后重试';
        $('editError').hidden = false;
      } finally {
        $('save').disabled = false;
        $('cancelEdit').disabled = false;
      }
    });
    $('name').addEventListener('input', () => $('name').setCustomValidity(''));
    $('confirmDelete').addEventListener('click', async () => {
      if (!deletingItem) return;
      $('deleteError').hidden = true;
      $('confirmDelete').disabled = true;
      $('cancelDelete').disabled = true;
      try {
        await getJson(`/api/items/${encodeURIComponent(deletingItem.id)}`, { method: 'DELETE' });
        $('deleteDialog').close();
        if (state.id !== null) { state.id = null; state.offset = 0; $('itemId').value = ''; }
        else if (state.rows.length === 1 && state.offset > 0) state.offset = Math.max(0, state.offset - state.limit);
        await load();
      } catch (error) {
        $('deleteError').textContent = error.message || '删除失败，请稍后重试';
        $('deleteError').hidden = false;
      } finally {
        $('confirmDelete').disabled = false;
        $('cancelDelete').disabled = false;
      }
    });

    async function load() {
      const sequence = ++state.sequence;
      const requestedId = state.id;
      state.loading = true;
      updateControls();
      setMessage('正在加载数据...');
      $('summary').textContent = '正在加载';
      try {
        const data = await getJson(requestedId === null ? `/api/items?limit=${state.limit}&offset=${state.offset}` : `/api/items/${encodeURIComponent(requestedId)}`);
        if (sequence !== state.sequence) return;
        state.rows = requestedId === null ? data.items : [data.item];
        if (state.rows.length) {
          renderRows(state.rows);
          $('summary').textContent = requestedId === null ? `显示第 ${state.offset + 1}–${state.offset + state.rows.length} 条` : '找到 1 条记录';
        } else {
          setMessage('暂无记录');
          $('summary').textContent = '没有更多记录';
        }
      } catch (error) {
        if (sequence !== state.sequence) return;
        state.rows = [];
        const notFound = requestedId !== null && error.status === 404;
        setMessage(notFound ? '未找到该记录' : '加载失败，请检查数据库连接后重试', !notFound);
        $('summary').textContent = notFound ? '找到 0 条记录' : '加载失败';
      } finally {
        if (sequence === state.sequence) { state.loading = false; updateControls(); }
      }
    }

    $('searchForm').addEventListener('submit', (event) => {
      event.preventDefault();
      const id = $('itemId').value.trim();
      if (!id || !/^[1-9]\d*$/.test(id)) { $('itemId').setCustomValidity('请输入大于 0 的整数'); $('itemId').reportValidity(); return; }
      $('itemId').setCustomValidity('');
      state.id = id;
      load();
    });
    $('itemId').addEventListener('input', () => $('itemId').setCustomValidity(''));
    $('reset').addEventListener('click', () => { state.id = null; state.offset = 0; $('itemId').value = ''; load(); });
    $('prev').addEventListener('click', () => { state.offset = Math.max(0, state.offset - state.limit); load(); });
    $('next').addEventListener('click', () => { state.offset += state.limit; load(); });
    $('pageSize').addEventListener('change', () => { state.limit = Number($('pageSize').value); state.offset = 0; load(); });
    $('refresh').addEventListener('click', () => { checkHealth(); load(); });
    checkHealth();
    load();
  </script>
</body>
</html>
